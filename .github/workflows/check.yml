name: Coursework checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    paths:
      - "assets/**"
      - "cases/**"
      - "docs/**"
      - "index.html"
      - "tools/**"
      - "package.json"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build case bundle
        run: npm run build
      - name: Run coursework checks
        run: npm run check
